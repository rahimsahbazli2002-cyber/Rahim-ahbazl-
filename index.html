<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Məktəbəqədər Müəllimlər Üçün İmtahan Testi</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
            --duo-blue: #1cb0f6;
            --duo-blue-shadow: #1899d6;
            --duo-red: #ff4b4b;
            --duo-red-shadow: #ea2b2b;
            --duo-purple: #ce82ff;
            --duo-purple-shadow: #b759f2;
            --duo-yellow: #ffc800;
            --duo-gray: #e5e5e5;
            --duo-dark-gray: #777;
            --duo-text: #4b4b4b;
            --bg-color: #f7f9fa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--duo-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background-color: #fff;
            border: 3px solid var(--duo-gray);
            border-radius: 24px;
            width: 100%;
            max-width: 750px;
            padding: 32px;
            position: relative;
            box-shadow: 0 8px 0 var(--duo-gray);
            transition: transform 0.2s ease;
        }

        /* Yuxarı Panel */
        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .close-btn {
            font-size: 1.5rem;
            color: var(--duo-dark-gray);
            cursor: pointer;
            font-weight: 900;
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.2) rotate(90deg);
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 18px;
            background-color: var(--duo-gray);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--duo-green), #78de19);
            border-radius: 12px;
            transition: width 0.4s cubic-bezier(0.65, 0, 0.35, 1);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 5px;
            right: 5px;
            height: 4px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 4px;
        }

        .stats-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--duo-yellow);
            animation: pulse 1.5s infinite alternate;
        }

        /* Sual Sahəsi Animasiyası */
        .question-box {
            animation: slideIn 0.3s ease-out;
        }

        .question-title {
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--duo-dark-gray);
            font-weight: 800;
            margin-bottom: 8px;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 800;
            color: #3c3c3c;
            margin-bottom: 28px;
            line-height: 1.4;
            white-space: pre-line;
        }

        /* Variantlar */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--duo-gray);
            border-bottom: 5px solid var(--duo-gray);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #4b4b4b;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f4f4f4;
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(3px);
            border-bottom-width: 2px;
            margin-bottom: 3px;
        }

        /* Seçilmiş variant halları */
        .option-btn.correct {
            background-color: #d7ffb8 !important;
            border-color: var(--duo-green) !important;
            border-bottom-color: var(--duo-green-shadow) !important;
            color: var(--duo-green-shadow) !important;
            animation: bounce 0.4s ease;
        }

        .option-btn.wrong {
            background-color: #ffdbe9 !important;
            border-color: var(--duo-red) !important;
            border-bottom-color: var(--duo-red-shadow) !important;
            color: var(--duo-red-shadow) !important;
            animation: shake 0.4s ease;
        }

        /* Əsəbi Adam Paneli */
        .angry-critic-box {
            display: none;
            background-color: #fff2f2;
            border: 2px solid var(--duo-red);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 20px;
            align-items: center;
            gap: 15px;
            animation: shake 0.4s ease;
        }

        .angry-avatar {
            font-size: 2.5rem;
            animation: angryPulse 0.5s infinite alternate;
        }

        .angry-speech {
            font-size: 1rem;
            font-weight: 800;
            color: var(--duo-red-shadow);
            line-height: 1.3;
        }

        /* Alt Düymələr */
        .footer {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            border-top: 2px solid var(--duo-gray);
            padding-top: 24px;
        }

        .btn {
            border: none;
            border-radius: 16px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: none !important;
        }

        .btn-gray {
            background-color: var(--duo-gray);
            color: var(--duo-dark-gray);
            box-shadow: 0 4px 0 #ccc;
        }

        .btn-green {
            background-color: var(--duo-green);
            color: white;
            box-shadow: 0 4px 0 var(--duo-green-shadow);
        }

        .btn-purple {
            background-color: var(--duo-purple);
            color: white;
            box-shadow: 0 4px 0 var(--duo-purple-shadow);
        }

        .btn-red {
            background-color: var(--duo-red);
            color: white;
            box-shadow: 0 4px 0 var(--duo-red-shadow);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Nəticə Ekranı */
        .result-screen {
            text-align: center;
            padding: 20px 0;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-icon {
            font-size: 5rem;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 2s infinite ease-in-out;
        }

        .result-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--duo-green);
            margin-bottom: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: #fff;
            border: 2px solid var(--duo-gray);
            border-bottom: 4px solid var(--duo-gray);
            border-radius: 16px;
            padding: 18px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 900;
        }

        .result-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Animasiya Keyframe-ləri */
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        @keyframes angryPulse {
            from { transform: scale(1) rotate(-5deg); }
            to { transform: scale(1.15) rotate(5deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Test Ekranı -->
    <div id="quiz-screen">
        <div class="header">
            <div class="close-btn" onclick="startQuiz()">✕</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="stats-badge">⚡ <span id="answered-count">0/60</span></div>
        </div>

        <div class="question-box" id="question-box">
            <div class="question-title" id="question-number">SUAL 1 / 60</div>
            <div id="question-text" class="question-text">Sual yüklənir...</div>
            <div id="options-container" class="options-container"></div>
        </div>

        <!-- Əsəbi Tənqidçi Bölməsi -->
        <div id="angry-critic" class="angry-critic-box">
            <div class="angry-avatar">🤬</div>
            <div class="angry-speech" id="angry-text">Bu nə cavabdır?! Bir az diqqətli ol!</div>
        </div>

        <div class="footer">
            <button id="prev-btn" class="btn btn-gray" onclick="prevQuestion()" disabled>GERİ</button>
            <button id="next-btn" class="btn btn-green" onclick="nextQuestion()">NÖVBƏTİ</button>
        </div>
    </div>

    <!-- Nəticə Ekranı -->
    <div id="result-screen" class="result-screen" style="display: none;">
        <div class="result-icon">🏆</div>
        <h2 class="result-title">Möhtəşəm İş!</h2>

        <div class="stats-grid">
            <div class="stat-card" style="color: var(--duo-green);">
                <span>ÜMUMİ BAL</span>
                <span class="stat-value" id="final-score">0.00</span>
            </div>
            <div class="stat-card" style="color: var(--duo-blue);">
                <span>NƏTİCƏ</span>
                <span class="stat-value" id="stat-percent">0%</span>
            </div>
            <div class="stat-card" style="color: var(--duo-green);">
                <span>DÜZGÜN</span>
                <span class="stat-value" id="stat-correct">0</span>
            </div>
            <div class="stat-card" style="color: var(--duo-red);">
                <span>SƏHV</span>
                <span class="stat-value" id="stat-incorrect">0</span>
            </div>
        </div>

        <div class="result-buttons">
            <button class="btn btn-purple" onclick="reviewAllQuiz()">BÜTÜN CAVABLARA BAX</button>
            <button class="btn btn-red" onclick="reviewWrongQuiz()">Səhvlərə bax</button>
            <button class="btn btn-green" onclick="startQuiz()">YENİDƏN BAŞLA</button>
        </div>
    </div>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(type) {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, audioCtx.currentTime);
        osc.frequency.setValueAtTime(130, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    } else if (type === 'win') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, audioCtx.currentTime);
        osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.15);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
    }
}

const angryRemarks = [
    "Bu nə cavabdır?! Sualı tam oxudun heç?! 😡",
    "Ciddi ola bilməzsən! Bu sualın cavabı bu deyildi! 🤦‍♂️",
    "Ay müəllim, bir az diqqətli ol! Belə də səhv olar?! 😤",
    "Gözüyumulu seçirsən variantları?! Yenidən fikir ver! 😠",
    "Gedib proqramı bir də oxumalısan, bu nə bərbad seçimdir! 💣",
    "Xeyr! Səhvdir! Kitabı aç, bir də oxu! ❌"
];

const rawQuestions = [
    { q: "1. Tərbiyəçi-müəllimin fəaliyyəti əyaniliyə əsaslanır. Uşaq tərbiyəçinin nə çəkdiyinə baxır və təkrar edir. Tərbiyəçi-müəllimin əsas vəzifələrindən biri uşağa karandaşı və fırçanı düzgün tutmağı öyrətməkdir. Bu, təsviri fəaliyyətin hansı növünə aiddir?", options: ["lepkaya (quraşdırma/plastilin)", "konstruksiyaetməyə", "rəsmçəkməyə", "applikasiyaya"], answer: 2 },
    { q: "2. Təsviri fəaliyyətin hansı növündə uşaqlarda tərbiyəçini dinləmək, uşaqların düşündüyü rəsmi çəkmək və nəticəni qiymətləndirmək bacarığını formalaşdırmaq vacibdir?", options: ["rəsmçəkmə", "lepka", "konstruksiyaetmə", "applikasiya"], answer: 0 },
    { q: "3. Bu texnika üçün kimyəvi qatqısı olmayan təhlükəsiz boya vacibdir. Bu, barmaqlar və ovuc içi ilə rəsm çəkməyə aiddir. Bu, rəsm texnikasının hansı növünə aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "monotipiya texnikası"], answer: 1 },
    { q: "4. Onun əsas xüsusiyyəti təmiz rənglərin istifadə edilməsidir, rənglərin qarışdırılmasına icazə verilmir. Onlar nöqtələrlə çəkirlər. Bu, rəsm texnikasının hansı növünə aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "monotipiya texnikası"], answer: 2 },
    { q: "5. Əgər fırçanın köməyilə müxtəlif formalı gülü rəngləsək və onu təmiz kağızın üzərinə çevirsək, gülün izi kağıza keçəcək. Sonra isə rəsm üçün fırçanın köməyilə işi bitirə bilərik. Bu, rəsm texnikasının hansı növünə aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "monotipiya texnikası"], answer: 0 },
    { q: "6. Leyla kağızın bir tərəfinə bir neçə damcı boya tökdü, sonra kağızı qatladı, ehtiyatla hamarladı və açaraq rəsmi fırça ilə tamamladı. Boya ləkəsini tətbiq etdikdən sonra boyanı kokteyl borucuğu ilə yaydı. Bu, hansı rəsm texnikasına aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "klyaksoqrafiya (ləkəçəkmə) texnikası"], answer: 3 },
    { q: "7. Rəsm şam və sabun tikəsi ilə yerinə yetirilir, akvarellə rənglədikdə boyanın altından rəsm üzə çıxır. Bu, hansı rəsm texnikasına aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "fotokopiya"], answer: 3 },
    { q: "8. Müxtəlif xalqların məişət əşyalarında, geyimlərində, evlərin bəzədilməsində tətbiq olunur. Bu, müxtəlif formaların onların bədii kompozisiyasının müvafiq fonunda yerləşdirilməsidir. Bu, təsviri fəaliyyətin hansı növünə aiddir?", options: ["lepka", "konstruksiyaetmə", "rəsmçəkmə", "applikasiya"], answer: 3 },
    { q: "9. Bu zaman uşaqlar mənimsəyirlər... iş üsullarını və yerinə yetiriləcək işin qabaqcadan planlaşdırılması, lazımi materialın seçilməsi, işə nəzarət və nəticənin qiymətləndirilməsi kimi bilik və bacarıqları əldə edirlər. Bu, təsviri fəaliyyətin hansı növünə aiddir?", options: ["lepka", "konstruksiyaetmə", "rəsmçəkmə", "applikasiya"], answer: 3 },
    { q: "10. Tərbiyəçi-müəllimin əsas fəaliyyəti əyanilikdir. Uşaq tərbiyəçinin nə çəkdiyinə baxır və təkrar edir. Bu, rəsmçəkmənin hansı yaş qrupuna aiddir?", options: ["1-ci kiçik qrupda rəsmçəkmə", "2-ci kiçik qrupda rəsmçəkmə", "məktəbəhazırlıq qrupunda rəsmçəkmə", "orta qrupda rəsmçəkmə"], answer: 0 },
    { q: "11. Tərbiyəçi tərbiyəçi-müəllimi dinləmək, gördüyünü və ya uşaqların düşündüyü rəsmi çəkmək, nəticəni qiymətləndirmək bacarığını formalaşdırır. Bu, hansı mərhələyə aiddir?", options: ["1-ci kiçik qrupda rəsmçəkmə", "2-ci kiçik qrupda rəsmçəkmə", "məktəbəhazırlıq qrupunda rəsmçəkmə", "orta qrupda rəsmçəkmə"], answer: 1 },
    { q: "12. Tərbiyəçi uşaqlara əşyanı detallara ayırmağı, onların məkanda yerləşməsinə diqqət yetirməyi öyrətməlidir. Bu, rəsmçəkmənin hansı mərhələsinə aiddir?", options: ["1-ci kiçik qrupda rəsmçəkmə", "2-ci kiçik qrupda rəsmçəkmə", "məktəbəhazırlıq qrupunda rəsmçəkmə", "böyük qrupda rəsmçəkmə"], answer: 3 },
    { q: "13. Məktəbəqədər yaşda uşaqların işinin keyfiyyətini nə xarakterizə edir?", options: ["obrazların ifadəliliyi", "texniki savadlılığın yüksək səviyyəsi", "düşüncənin dərinliyi, ünsiyyət sferası", "işin yerinə yetirilməsinə analitik yanaşma"], answer: 0 },
    { q: "14. Uşaqlarda estetik zövqü, bədii yaradıcılıq qabiliyyətini, təsviri, rəngi, formanı, əşyaların ölçüsünü səsləndirmək bacarığını formalaşdırmaq lazımdır:", options: ["1-ci kiçik qrupda rəsmçəkmə", "2-ci kiçik qrupda rəsmçəkmə", "məktəbəhazırlıq qrupunda rəsmçəkmə", "orta qrupda rəsmçəkmə"], answer: 3 },
    { q: "15. Bu yaş dövrünün xüsusiyyətlərini nəzərə alaraq qayçı verilmir, bütün fiqurlar hazırdır, əlvan kağızı isə əlləri ilə cırırlar. Bu, applikasiyanın hansı mərhələsinə aiddir?", options: ["2-ci kiçik qrupda", "orta qrupda applikasiya", "böyük qrupda applikasiya", "məktəbəhazırlıq qrupunda applikasiya"], answer: 0 },
    { q: "16. Bu, gündəlik həyat əşyalarının izlənilməsini əhatə edir. Məşğələ zamanı uşaqlar əşyaları sualsız müzakirə etməyi öyrənirlər. Bu, applikasiyanın hansı mərhələsinə aiddir?", options: ["2-ci kiçik qrupda", "orta qrupda applikasiya", "böyük qrupda applikasiya", "məktəbəhazırlıq qrupunda applikasiya"], answer: 2 },
    { q: "17. Bu yaş dövründə uşaqların əl əzələləri möhkəmlənir, hərəkətləri daha dəqiq və idarəolunan olur. Tərbiyəçi-müəllim əşyaya baxarkən uşaqları aktivləşdirir, əşyanı təsvir etməyi xahiş edir. Bu, applikasiyanın hansı mərhələsinə aiddir?", options: ["2-ci kiçik qrupda", "orta qrupda applikasiya", "böyük qrupda applikasiya", "məktəbəhazırlıq qrupunda applikasiya"], answer: 1 },

    { q: "47. Təsviri fəaliyyətdə 'Relyefli lepka' ne deməkdir?", options: ["Müstəvi (lövhə) üzərində qabarıq təsvirin yaradılması", "Kağızı cırmaq", "Masa üzərində su tökmək", "Rəngləri qarışdırmaq"], answer: 0 },
    { q: "48. Aşağıdakılardan hansı qeyri-ənənəvi rəsm texnikası DEYİL?", options: ["Adi karandaşla xətt çəkmək", "Barmaq boyakarlığı", "Klyaksoqrafiya", "Puantilizm"], answer: 0 },
    { q: "49. Uşağa qayçı ilə işləmə qaydalarını öyrədərkən birinci növbədə nəyə diqqət yetirilməlidir?", options: ["Təhlükəsizlik qaydalarına", "Kəsmə sürətinə", "Kağızın rənginə", "Dərsin vaxtına"], answer: 0 },
    { q: "50. Məktəbəqədər müəssisədə fiziki dəqiqələrin (fizkultminutka) keçirilməsində məqsəd nədir?", options: ["Yorğunluğu aradan qaldırmaq və diqqəti bərpa etmək", "Uşaqları cəzalandırmaq", "Məşğələni tez bitirmək", "Yalnız idman zalına getmək"], answer: 0 },
    { q: "51. Plastilinlə iş zamanı istifadə olunan xüsusi plastik bıçaq necə adlanır?", options: ["Stek", "Palitra", "Molbert", "Şstamp"], answer: 0 },
    { q: "52. Boyaları qarışdırmaq üçün istifadə olunan lövhə necə adlanır?", options: ["Palitra", "Molbert", "Stek", "Karkas"], answer: 0 },
    { q: "53. Rəsm çəkmək üçün üzərində kağız və ya kətillər bərkidilən altlıq/stend necə adlanır?", options: ["Molbert", "Palitra", "Plandor", "Eskiz"], answer: 0 },
    { q: "54. Uşaqlarda ritm və hərəkət koordinasiyasını inkişaf etdirən fiziki məşq növü hansıdır?", options: ["Musiqili-ritmik gimnastika", "Ağır atletika", "Şahmat", "Yalnız qaçış"], answer: 0 },
    { q: "55. Kiçik qrupda lepkadan istifadə edərkən hansı sadə üsullar öyrədilir?", options: ["Yumrulama (kürəcik), yayma (çubuq/sosiska)", "Mürəkkəb heykəltəraşlıq", "Oymaçılıq", "Cilalama"], answer: 0 },
    { q: "56. Təsviri fəaliyyətdə 'Kompozisiya' ne deməkdir?", options: ["Hissələrin müəyyən nizamla və bədii bütövlükdə birləşdirilməsi", "Yalnız rənglərin seçilməsi", "İstifadə olunan fırçaların sayı", "Kağızın ölçüsü"], answer: 0 },
    { q: "57. Uşaqlarda fəza təfəkkürünü və mühəndislik rüşeymlərini inkişaf etdirən fəaliyyət hansıdır?", options: ["Konstruksiyaetmə", "Yalnız Mahnı oxumaq", "Şeir demək", "Yalnız Nağıl dinləmək"], answer: 0 },
    { q: "58. Uşaq bağçasında səhər gimnastikasının müddəti kiçik qruplarda nə qədər olmalıdır?", options: ["5-6 dəqiqə", "20 dəqiqə", "30 dəqiqə", "1 dəqiqə"], answer: 0 },
    { q: "59. Səhər gimnastikasının əsas pedaqoji məqsədi nədir?", options: ["Uşaq orqanizmini oyatmaq və günə gümrah başlamaq", "Uşaqları yormaq", "Səhər yeməyini gecikdirmək", "İntizamı sərtləşdirmək"], answer: 0 },
    { q: "60. Tərbiyəçi məşğələ zamanı uşaqların fərdi xüsusiyyətlərini necə nəzərə almalıdır?", options: ["Hər bir uşağın inkişaf tempinə və bacarığına uyğun fərdi yanaşaraq", "Hamıya eyni dərəcədə təzyiq edərək", "Zəif uşaqları fəaliyyətdən təcrid edərək", "Yalnız fəal uşaqlarla işləyərək"], answer: 0 }
];

const optionPrefixes = ["A) ", "B) ", "C) ", "D) "];

let currentQuestions = [];
let activeQuestionsList = [];
let currentQuestionIndex = 0;
let userAnswers = [];
let isReviewMode = false;

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startQuiz() {
    playSound('click');
    isReviewMode = false;
    let shuffledQuestions = shuffleArray(rawQuestions);
    let selectedQuestions = shuffledQuestions.slice(0, 60);

    currentQuestions = selectedQuestions.map(qObj => {
        let optionsWithFlag = qObj.options.map((opt, idx) => ({
            text: opt,
            isCorrect: idx === qObj.answer
        }));
        optionsWithFlag = shuffleArray(optionsWithFlag);
        
        return {
            q: qObj.q,
            options: optionsWithFlag.map(o => o.text),
            answer: optionsWithFlag.findIndex(o => o.isCorrect)
        };
    });

    activeQuestionsList = currentQuestions.map((q, idx) => ({ question: q, originalIndex: idx }));
    currentQuestionIndex = 0;
    userAnswers = new Array(currentQuestions.length).fill(null);
    
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    showQuestion();
}

function showQuestion() {
    let item = activeQuestionsList[currentQuestionIndex];
    let q = item.question;
    let originalIdx = item.originalIndex;
    let total = activeQuestionsList.length;

    // Əsəbi adam pəncərəsini gizlət
    document.getElementById("angry-critic").style.display = "none";

    // Sual animasiyasını sıfırla
    const qBox = document.getElementById("question-box");
    qBox.style.animation = 'none';
    qBox.offsetHeight; 
    qBox.style.animation = 'slideIn 0.3s ease-out';

    document.getElementById("prev-btn").disabled = (currentQuestionIndex === 0);
    
    if (isReviewMode) {
        document.getElementById("next-btn").innerText = (currentQuestionIndex === total - 1) ? "NƏTİCƏLƏR" : "NÖVBƏTİ";
    } else {
        document.getElementById("next-btn").innerText = (currentQuestionIndex === total - 1) ? "TƏSTİ BİTİR" : "NÖVBƏTİ";
    }

    document.getElementById("question-number").innerText = `SUAL ${currentQuestionIndex + 1} / ${total}`;
    
    let answeredCount = userAnswers.filter(a => a !== null).length;
    document.getElementById("answered-count").innerText = `${answeredCount}/${currentQuestions.length}`;
    document.getElementById("progress-bar").style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;

    document.getElementById("question-text").innerText = q.q;

    let optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    let selectedIdx = userAnswers[originalIdx];
    let correctIdx = q.answer;

    q.options.forEach((optText, idx) => {
        let btn = document.createElement("button");
        btn.className = "option-btn";
        let prefixedText = optionPrefixes[idx] + optText;
        
        if (isReviewMode) {
            btn.disabled = true;
            if (idx === correctIdx) {
                btn.classList.add("correct");
                btn.innerHTML = `<span>${prefixedText}</span> <span>✓</span>`;
            } else if (idx === selectedIdx) {
                btn.classList.add("wrong");
                btn.innerHTML = `<span>${prefixedText}</span> <span>✕</span>`;
            } else {
                btn.innerHTML = `<span>${prefixedText}</span>`;
            }
        } 
        else {
            if (selectedIdx !== null) {
                if (idx === correctIdx) {
                    btn.classList.add("correct");
                    btn.innerHTML = `<span>${prefixedText}</span> <span>✓</span>`;
                } else if (idx === selectedIdx) {
                    btn.classList.add("wrong");
                    btn.innerHTML = `<span>${prefixedText}</span> <span>✕</span>`;
                } else {
                    btn.innerHTML = `<span>${prefixedText}</span>`;
                }
            } else {
                btn.innerHTML = `<span>${prefixedText}</span>`;
            }
            btn.onclick = () => selectOption(idx);
        }

        optionsContainer.appendChild(btn);
    });

    // Əgər artıq səhv cavab seçilibsə, əsəbi adamı saxla
    if (selectedIdx !== null && selectedIdx !== correctIdx && !isReviewMode) {
        showAngryCritic();
    }
}

function showAngryCritic() {
    const criticBox = document.getElementById("angry-critic");
    const criticText = document.getElementById("angry-text");
    
    // Təsadüfi əsəbi söz seç
    const randomRemark = angryRemarks[Math.floor(Math.random() * angryRemarks.length)];
    criticText.innerText = randomRemark;
    
    criticBox.style.display = "flex";
}

function selectOption(selectedIndex) {
    if (isReviewMode) return;

    let originalIdx = activeQuestionsList[currentQuestionIndex].originalIndex;
    let correctIdx = activeQuestionsList[currentQuestionIndex].question.answer;

    if (userAnswers[originalIdx] === selectedIndex) {
        userAnswers[originalIdx] = null;
        playSound('click');
        document.getElementById("angry-critic").style.display = "none";
    } else {
        userAnswers[originalIdx] = selectedIndex;
        if (selectedIndex === correctIdx) {
            playSound('correct');
            document.getElementById("angry-critic").style.display = "none";
        } else {
            playSound('wrong');
            showAngryCritic();
        }
    }
    showQuestion();
}

function prevQuestion() {
    playSound('click');
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        showQuestion();
    }
}

function nextQuestion() {
    playSound('click');
    if (currentQuestionIndex < activeQuestionsList.length - 1) {
        currentQuestionIndex++;
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    playSound('win');
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";

    let correct = 0, incorrect = 0, unanswered = 0;

    userAnswers.forEach((ans, idx) => {
        if (ans === null) unanswered++;
        else if (ans === currentQuestions[idx].answer) correct++;
        else incorrect++;
    });

    let total = currentQuestions.length;
    let finalScore = Math.max(0, (correct * 1) - (incorrect * 0.25));
    let percentage = (correct / total) * 100;

    document.getElementById("final-score").innerText = `${finalScore.toFixed(2)}`;
    document.getElementById("stat-correct").innerText = correct;
    document.getElementById("stat-incorrect").innerText = incorrect;
    document.getElementById("stat-percent").innerText = `${percentage.toFixed(0)}%`;
}

function reviewAllQuiz() {
    playSound('click');
    isReviewMode = true;
    activeQuestionsList = currentQuestions.map((q, idx) => ({ question: q, originalIndex: idx }));
    currentQuestionIndex = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    showQuestion();
}

function reviewWrongQuiz() {
    playSound('click');
    let wrongList = [];

    currentQuestions.forEach((q, idx) => {
        let ans = userAnswers[idx];
        if (ans !== null && ans !== q.answer) {
            wrongList.push({ question: q, originalIndex: idx });
        }
    });

    if (wrongList.length === 0) {
        alert("Təbrik edirik! Sizin heç bir səhv cavabınız yoxdur. 🎉");
        return;
    }

    isReviewMode = true;
    activeQuestionsList = wrongList;
    currentQuestionIndex = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    showQuestion();
}

window.onload = startQuiz;
</script>
