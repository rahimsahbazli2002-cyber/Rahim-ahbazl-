<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Məktəbəqədər Müəllimlər Üçün İmtahan Testi (534 Sual)</title>
    <style>
        :root {
            --primary-color: #3b82f6;
            --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --selected-border: #3b82f6;
            --selected-bg: #eff6ff;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            position: relative;
        }

        .header { margin-bottom: 20px; }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #4b5563;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: var(--border-color);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 25px 0;
            line-height: 1.5;
            white-space: pre-line;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            line-height: 1.4;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #f8fafc;
        }

        .option-btn.selected {
            background-color: var(--selected-bg) !important;
            border-color: var(--selected-border) !important;
            font-weight: 600;
        }

        .footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .prev-btn, .next-btn, .restart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .prev-btn { background-color: #6b7280; }
        .prev-btn:hover:not([disabled]) { background-color: #4b5563; }
        .next-btn:hover:not([disabled]), .restart-btn:hover { background-color: var(--primary-hover); }

        .prev-btn:disabled, .next-btn:disabled {
            background-color: #d1d5db;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .result-screen { text-align: center; }
        .result-title { font-size: 1.8rem; margin-bottom: 20px; }
        .score-box { font-size: 2.5rem; font-weight: 700; color: var(--primary-color); margin-bottom: 25px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
            text-align: left;
        }

        .stat-card {
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }

        .stat-card span { float: right; font-weight: 700; }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <div id="quiz-screen">
        <div class="header">
            <div class="progress-info">
                <span id="question-number">Sual 1 / 60</span>
                <span id="answered-count">Cavablandırıldı: 0/60</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div id="question-text" class="question-text">Sual mətni yüklənir...</div>
        <div id="options-container" class="options-container"></div>

        <div class="footer">
            <button id="prev-btn" class="prev-btn" onclick="prevQuestion()" disabled>← Əvvəlki sual</button>
            <button id="next-btn" class="next-btn" onclick="nextQuestion()">Növbəti sual →</button>
        </div>
    </div>

    <div id="result-screen" class="result-screen" style="display: none;">
        <h2 class="result-title">Test Yekunlaşdı!</h2>
        <div class="score-box" id="final-score">0.00</div>

        <div class="stats-grid">
            <div class="stat-card">Düzgün cavab: <span id="stat-correct" style="color: #10b981;">0</span></div>
            <div class="stat-card">Səhv cavab: <span id="stat-incorrect" style="color: #ef4444;">0</span></div>
            <div class="stat-card">Cavabsız sual: <span id="stat-unanswered">0</span></div>
            <div class="stat-card">Nəticə (Faiz): <span id="stat-percent">0%</span></div>
            <div class="stat-card">Maksimum bal: <span>60</span></div>
            <div class="stat-card">Ümumi sual: <span id="stat-total">60</span></div>
        </div>

        <button class="restart-btn" onclick="startQuiz()">Testi yenidən başlat</button>
    </div>
</div>

<script>
// 534 sualın massivi (Bura istənilən qədər sual əlavə edilə bilər)
const rawQuestions = [
    /* 534 Sualın massivi bura daxil olunur */
];

let currentQuestions = [];
let currentQuestionIndex = 0;
let userAnswers = [];

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startQuiz() {
    let shuffledQuestions = shuffleArray(rawQuestions);
    // 534 sualdan təsadüfi 60 sual seçilir
    let selectedQuestions = shuffledQuestions.slice(0, Math.min(60, shuffledQuestions.length));

    currentQuestions = selectedQuestions.map(qObj => {
        let optionsWithFlag = qObj.options.map((opt, idx) => ({
            text: opt,
            isCorrect: idx === qObj.answer
        }));
        optionsWithFlag = shuffleArray(optionsWithFlag);
        
        return {
            q: qObj.q,
            options: optionsWithFlag.map(o => o.text),
            answer: optionsWithFlag.findIndex(o => o.isCorrect)
        };
    });

    currentQuestionIndex = 0;
    userAnswers = new Array(currentQuestions.length).fill(null);
    
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    showQuestion();
}

function showQuestion() {
    let q = currentQuestions[currentQuestionIndex];
    let total = currentQuestions.length;

    document.getElementById("prev-btn").disabled = (currentQuestionIndex === 0);
    document.getElementById("next-btn").innerText = (currentQuestionIndex === total - 1) ? "Testi Bitir ✓" : "Növbəti sual →";

    document.getElementById("question-number").innerText = `Sual ${currentQuestionIndex + 1} / ${total}`;
    
    let answeredCount = userAnswers.filter(a => a !== null).length;
    document.getElementById("answered-count").innerText = `Cavablandırıldı: ${answeredCount}/${total}`;
    document.getElementById("progress-bar").style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;

    document.getElementById("question-text").innerText = q.q;

    let optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    let selectedIdx = userAnswers[currentQuestionIndex];

    q.options.forEach((optText, idx) => {
        let btn = document.createElement("button");
        btn.className = "option-btn";
        if (idx === selectedIdx) btn.classList.add("selected");
        btn.innerHTML = `<span>${optText}</span>`;
        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
    });
}

function selectOption(selectedIndex) {
    if (userAnswers[currentQuestionIndex] === selectedIndex) {
        userAnswers[currentQuestionIndex] = null;
    } else {
        userAnswers[currentQuestionIndex] = selectedIndex;
    }
    showQuestion();
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        showQuestion();
    }
}

function nextQuestion() {
    if (currentQuestionIndex < currentQuestions.length - 1) {
        currentQuestionIndex++;
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";

    let correct = 0, incorrect = 0, unanswered = 0;

    userAnswers.forEach((ans, idx) => {
        if (ans === null) unanswered++;
        else if (ans === currentQuestions[idx].answer) correct++;
        else incorrect++;
    });

    let total = currentQuestions.length;
    let finalScore = Math.max(0, (correct * 1) - (incorrect * 0.25));
    let percentage = (correct / total) * 100;

    document.getElementById("final-score").innerText = `${finalScore.toFixed(2)} / ${total}`;
    document.getElementById("stat-correct").innerText = correct;
    document.getElementById("stat-incorrect").innerText = incorrect;
    document.getElementById("stat-unanswered").innerText = unanswered;
    document.getElementById("stat-percent").innerText = `${percentage.toFixed(1)}%`;
    document.getElementById("stat-total").innerText = total;
}

window.onload = startQuiz;
</script>

</body>
</html>
