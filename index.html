<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Məktəbəqədər Müəllimlər Üçün İmtahan Testi</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --duo-green: #58cc02;
            --duo-green-shadow: #46a302;
            --duo-gray: #e5e5e5;
            --duo-gray-shadow: #cecece;
            --duo-text: #3c3c3c;
            --duo-blue: #1cb0f6;
            --duo-blue-shadow: #1899d6;
            --duo-red: #ff4b4b;
            --duo-red-shadow: #ea2b2b;
            --duo-purple: #ce82ff;
            --duo-purple-shadow: #a559d6;
            --correct-bg: #d7ffb8;
            --correct-border: #58cc02;
            --correct-text: #2b7000;
            --wrong-bg: #ffdfe0;
            --wrong-border: #ff4b4b;
            --wrong-text: #ea2b2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            user-select: none;
        }

        body {
            background-color: #ffffff;
            color: var(--duo-text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Header & Progress Bar */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #afafaf;
            cursor: pointer;
            font-weight: 800;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 16px;
            background-color: var(--duo-gray);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--duo-green);
            border-radius: 12px;
            transition: width 0.3s cubic-bezier(0.65, 0, 0.35, 1);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 5px;
            right: 5px;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }

        .stats-badge {
            font-size: 0.95rem;
            font-weight: 800;
            color: #afafaf;
            white-space: nowrap;
        }

        .topic-badge {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--duo-blue);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Question Section */
        .question-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--duo-text);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Options */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .option-btn {
            background-color: #ffffff;
            border: 2px solid var(--duo-gray);
            border-bottom: 4px solid var(--duo-gray-shadow);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--duo-text);
            text-align: left;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            line-height: 1.4;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #f7f7f7;
            border-color: #cecece;
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            border-bottom-width: 2px;
            margin-bottom: 2px;
        }

        .option-prefix {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border: 2px solid var(--duo-gray);
            border-radius: 8px;
            margin-right: 12px;
            font-weight: 800;
            color: #afafaf;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .option-btn.selected {
            background-color: #ddf4ff;
            border-color: var(--duo-blue);
            border-bottom-color: var(--duo-blue-shadow);
            color: #1899d6;
        }

        .option-btn.selected .option-prefix {
            border-color: var(--duo-blue);
            color: var(--duo-blue);
            background-color: #ffffff;
        }

        .option-btn.correct {
            background-color: var(--correct-bg) !important;
            border-color: var(--correct-border) !important;
            border-bottom-color: var(--duo-green-shadow) !important;
            color: var(--correct-text) !important;
        }

        .option-btn.correct .option-prefix {
            border-color: var(--duo-green);
            background-color: var(--duo-green);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg) !important;
            border-color: var(--wrong-border) !important;
            border-bottom-color: var(--duo-red-shadow) !important;
            color: var(--wrong-text) !important;
        }

        .option-btn.wrong .option-prefix {
            border-color: var(--duo-red);
            background-color: var(--duo-red);
            color: white;
        }

        /* Footer & Actions */
        .footer {
            border-top: 2px solid var(--duo-gray);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .duo-btn {
            border: none;
            border-radius: 16px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.1s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .duo-btn-green {
            background-color: var(--duo-green);
            color: #ffffff;
            box-shadow: 0 4px 0 var(--duo-green-shadow);
        }

        .duo-btn-green:hover:not(:disabled) { filter: brightness(1.05); }
        .duo-btn-green:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--duo-green-shadow); }

        .duo-btn-gray {
            background-color: #ffffff;
            color: #afafaf;
            border: 2px solid var(--duo-gray);
            box-shadow: 0 4px 0 var(--duo-gray-shadow);
        }

        .duo-btn-gray:hover:not(:disabled) { background-color: #f7f7f7; color: var(--duo-text); }
        .duo-btn-gray:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--duo-gray-shadow); }

        .duo-btn-purple {
            background-color: var(--duo-purple);
            color: #ffffff;
            box-shadow: 0 4px 0 var(--duo-purple-shadow);
        }

        .duo-btn-purple:hover:not(:disabled) { filter: brightness(1.05); }
        .duo-btn-purple:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--duo-purple-shadow); }

        .duo-btn-red {
            background-color: var(--duo-red);
            color: #ffffff;
            box-shadow: 0 4px 0 var(--duo-red-shadow);
        }

        .duo-btn-red:hover:not(:disabled) { filter: brightness(1.05); }
        .duo-btn-red:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 var(--duo-red-shadow); }

        .duo-btn:disabled {
            background-color: var(--duo-gray);
            color: #afafaf;
            box-shadow: none;
            cursor: not-allowed;
            border: none;
        }

        /* Result Screen */
        .result-screen {
            text-align: center;
            padding: 20px 0;
        }

        .result-icon { font-size: 5rem; margin-bottom: 15px; }
        .result-title { font-size: 2.2rem; font-weight: 900; color: #ffc800; margin-bottom: 10px; }
        .score-box { font-size: 3.5rem; font-weight: 900; color: var(--duo-green); margin-bottom: 30px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .stat-card {
            background-color: #ffffff;
            border: 2px solid var(--duo-gray);
            border-bottom: 4px solid var(--duo-gray-shadow);
            border-radius: 16px;
            padding: 15px;
            font-weight: 800;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .footer { flex-direction: column; }
            .duo-btn { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <!-- Test Ekranı -->
    <div id="quiz-screen">
        <div class="header">
            <button class="close-btn">✕</button>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="stats-badge" id="question-number">1 / 60</div>
        </div>

        <div id="topic-title" class="topic-badge">MÖVZU 1</div>
        <div id="question-text" class="question-title">Sual mətni yüklənir...</div>
        <div id="options-container" class="options-container"></div>

        <div class="footer">
            <button id="prev-btn" class="duo-btn duo-btn-gray" onclick="prevQuestion()" disabled>ƏVVƏLKİ</button>
            <button id="next-btn" class="duo-btn duo-btn-green" onclick="nextQuestion()">NÖVBƏTİ</button>
        </div>
    </div>

    <!-- Nəticə Ekranı -->
    <div id="result-screen" class="result-screen" style="display: none;">
        <div class="result-icon">🎉</div>
        <h2 class="result-title">MƏRHƏLƏ TAMAMLANDI!</h2>
        <div class="score-box" id="final-score">0.00</div>

        <div class="stats-grid">
            <div class="stat-card">Düzgün: <span id="stat-correct" style="color: var(--duo-green);">0</span></div>
            <div class="stat-card">Səhv: <span id="stat-incorrect" style="color: var(--duo-red);">0</span></div>
            <div class="stat-card">Cavabsız: <span id="stat-unanswered" style="color: #afafaf;">0</span></div>
            <div class="stat-card">Dəqiqlik: <span id="stat-percent" style="color: var(--duo-blue);">0%</span></div>
        </div>

        <div class="result-buttons">
            <button class="duo-btn duo-btn-purple" onclick="reviewAllQuiz()">🔍 Bütün Cavablara Bax</button>
            <button class="duo-btn duo-btn-red" onclick="reviewWrongQuiz()">❌ Səhvlərə Bax</button>
            <button class="duo-btn duo-btn-green" id="next-topic-btn" onclick="startNextTopic()">➡️ NÖVBƏTİ MÖVZUYA KEÇ (MÖVZU 2)</button>
            <button class="duo-btn duo-btn-gray" onclick="restartCurrentTopic()">🔄 BU MÖVZUNU YENİDƏN İŞLƏ</button>
        </div>
    </div>
</div>

<script>
// Mövzu üzrə 60-lıq test blokları
const quizTopics = [
    {
        title: "1. Təsviri Fəaliyyət və Fiziki Tərbiyə Metodikası",
        questions: [
            { q: "1. Tərbiyəçi-müəllimin fəaliyyəti əyaniliyə əsaslanır. Uşaq tərbiyəçinin nə çəkdiyinə baxır və təkrar edir. Tərbiyəçi-müəllimin əsas vəzifələrindən biri uşağa karandaşı və fırçanı düzgün tutmağı öyrətməkdir. Bu, təsviri fəaliyyətin hansı növünə aiddir?", options: ["lepkaya (quraşdırma/plastilin)", "konstruksiyaetməyə", "rəsmçəkməyə", "applikasiyaya"], answer: 2 },
            { q: "2. Təsviri fəaliyyətin hansı növündə uşaqlarda tərbiyəçini dinləmək, uşaqların düşündüyü rəsmi çəkmək və nəticəni qiymətləndirmək bacarığını formalaşdırmaq vacibdir?", options: ["rəsmçəkmə", "lepka", "konstruksiyaetmə", "applikasiya"], answer: 0 },
            { q: "3. Bu texnika üçün kimyəvi qatqısı olmayan təhlükəsiz boya vacibdir. Bu, barmaqlar və ovuc içi ilə rəsm çəkməyə aiddir. Bu, rəsm texnikasının hansı növünə aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "monotipiya texnikası"], answer: 1 },
            { q: "4. Onun əsas xüsusiyyəti təmiz rənglərin istifadə edilməsidir, rənglərin qarışdırılmasına icazə verilmir. Onlar nöqtələrlə çəkirlər. Bu, rəsm texnikasının hansı növünə aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "monotipiya texnikası"], answer: 2 },
            { q: "5. Əgər fırçanın köməyilə müxtəlif formalı gülü rəngləsək və onu təmiz kağızın üzərinə çevirsək, gülün izi kağıza keçəcək. Sonra isə rəsm üçün fırçanın köməyilə işi bitirə bilərik. Bu, rəsm texnikasının hansı növünə aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "monotipiya texnikası"], answer: 0 },
            { q: "6. Leyla kağızın bir tərəfinə bir neçə damcı boya tökdü, sonra kağızı qatladı, ehtiyatla hamarladı və açaraq rəsmi fırça ilə tamamladı. Boya ləkəsini tətbiq etdikdən sonra boyanı kokteyl borucuğu ilə yaydı. Bu, hansı rəsm texnikasına aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "klyaksoqrafiya (ləkəçəkmə) texnikası"], answer: 3 },
            { q: "7. Rəsm şam və sabun tikəsi ilə yerinə yetirilir, akvarellə rənglədikdə boyanın altından rəsm üzə çıxır. Bu, hansı rəsm texnikasına aiddir?", options: ["ştamplama texnikası", "barmaq boyakarlığı", "puantilizm texnikası", "fotokopiya"], answer: 3 },
            { q: "8. Müxtəlif xalqların məişət əşyalarında, geyimlərində, evlərin bəzədilməsində tətbiq olunur. Bu, müxtəlif formaların onların bədii kompozisiyasının müvafiq fonunda yerləşdirilməsidir. Bu, təsviri fəaliyyətin hansı növünə aiddir?", options: ["lepka", "konstruksiyaetmə", "rəsmçəkmə", "applikasiya"], answer: 3 },
            { q: "9. Bu zaman uşaqlar mənimsəyirlər... iş üsullarını və yerinə yetiriləcək işin qabaqcadan planlaşdırılması, lazımi materialın seçilməsi, işə nəzarət və nəticənin qiymətləndirilməsi kimi bilik və bacarıqları əldə edirlər. Bu, təsviri fəaliyyətin hansı növünə aiddir?", options: ["lepka", "konstruksiyaetmə", "rəsmçəkmə", "applikasiya"], answer: 3 },
            { q: "10. Tərbiyəçi-müəllimin əsas fəaliyyəti əyanilikdir. Uşaq tərbiyəçinin nə çəkdiyinə baxır və təkrar edir. Bu, rəsmçəkmənin hansı yaş qrupuna aiddir?", options: ["1-ci kiçik qrupda rəsmçəkmə", "2-ci kiçik qrupda rəsmçəkmə", "məktəbəhazırlıq qrupunda rəsmçəkmə", "orta qrupda rəsmçəkmə"], answer: 0 },
            { q: "11. Fiziki tərbiyə məşğələlərinə dair təqdim olunan mülahizələrdən biri yanlışdır:", options: ["uşaqlarda yüksək fiziki dözümlülük.", "uşaqlarda yalnız iri motorika inkişaf edir.", "uşaq orqanizminin sağlamlığını qorumağa kömək edir.", "psixoloji gərginliyi aradan qaldırır."], answer: 1 },
            { q: "12. Məşğələlərin frontal forması hansı iş formasıdır?", options: ["Kollektiv", "Fərdi", "Cütlərlə", "Qrupla"], answer: 0 },
            { q: "13. Bu iş formasında uşaqlar müəyyən fiziki hərəkətləri ardıcıl olaraq yerinə yetirirlər:", options: ["Qruplarla", "Cütlərlə", "Konveyer", "Frontal"], answer: 2 },
            { q: "14. Hansı iş formasında müəllim lider təyin edir, uşaqlar isə yerlərini növbə ilə dəyişərək müəyyən fiziki hərəkətləri yerinə yetirirlər?", options: ["Konveyer", "Qrupla", "Kollektiv", "Fərdi"], answer: 1 },
            { q: "15. Fiziki tərbiyə məşğələlərində tətbiq olunan üsullardan biri yanlışdır:", options: ["hərəkətlərin yalnız bir dəfə göstərilməsi", "hərəkətin izahı və göstərilməsi", "hərəkətlərin möhkəmləndirilməsi", "konkret tapşırıqlarla hərəkətlərin öyrədilməsi"], answer: 0 },
            { q: "16. Lepka məşğələsində hansı xammal materialından istifadə olunmur?", options: ["Plastilin", "Gil", "Xəmir", "Sement"], answer: 3 },
            { q: "17. Məktəbəqədər müəssisədə səhər gimnastikasının əsas məqsədi nədir?", options: ["Uşaq orqanizmini oyatmaq və gümrahlaşdırmaq", "Ağır idman rekordları vurmaq", "Səhər yeməyini əvəz etmək", "Uşaqları yorub yatırtmaq"], answer: 0 },
            { q: "18. Kiçik motorikanın inkişafı üçün hansı təsviri fəaliyyət növü daha effektivdir?", options: ["Lepka və Applikasiya", "Yalnız qaçış hərəkətləri", "Müzik dinləmək", "Yalnız şeir əzbərləmək"], answer: 0 },
            { q: "19. Applikasiya işində istifadə olunan əsas alət hansıdır?", options: ["Qayçı və yapışqan", "Çəkic və mismar", "Xətkeş və pərgar", "Akvarel və fırça"], answer: 0 },
            { q: "20. Konstruksiyaetmə fəaliyyətinə nə daxildir?", options: ["Tikinti materiallarından müxtəlif fiqurlar və binalar quraşdırmaq", "Rəsm dəftərində boyamaq", "Nağıl danışmaq", "Mahnı oxumaq"], answer: 0 },
            { q: "21. Hərəkətli oyunların əsas funksiyası nədir?", options: ["Uşaqların fiziki keyfiyyətlərini və çevikliyini inkişaf etdirmək", "Yalnız nizam-intizamı pozmaq", "Sakitliyi təmin etmək", "Yazı yazmağı öyrətmək"], answer: 0 },
            { q: "22. Qrupda fiziki tərbiyə dəqiqələri (fizkulutminutka) nə vaxt keçirilir?", options: ["Məşğələ zamanı yorğunluğu aradan qaldırmaq üçün mid-fasilədə", "Yalnız gəzinti vaxtı", "Yalnız yuxudan sonra", "Səhər yeməyindən əvvəl"], answer: 0 },
            { q: "23. Kağızdan müxtəlif formalar kəsib yapışdırmaq hansı fəaliyyətdir?", options: ["Applikasiya", "Lepka", "Rəsm", "Gimnastika"], answer: 0 },
            { q: "24. Açıq havada keçirilən fiziki hərəkətlərin üstünlüyü nədir?", options: ["Orqanizmin möhkəmlənməsi və temiz hava qəbulu", "Otağın çirklənməməsi", "Uşaqların tez yorulması", "Heç bir üstünlüyü yoxdur"], answer: 0 },
            { q: "25. 2-ci kiçik qrupda rəsm çəkərkən hansı fırça növünə üstünlük verilir?", options: ["Yoğun və yumşaq fırçalara", "Çox incə qələmlərə", "Quru quş tükünə", "Metal millərə"], answer: 0 },
            { q: "26. Fırçanı boyaya batırarkən hansı qaydaya əməl edilməlidir?", options: ["Fırçanın yalnız tük hissəsini batırmaq", "Fırçanın sapını tam batırmaq", "Fırçanı boyada sıxmaq", "Fırçanı su ilə yumadan rəngə qatmaq"], answer: 0 },
            { q: "27. Barmaq boyakarlığı zamanı istifadə olunan boyanın əsas xassəsi nə olmalıdır?", options: ["Zərərsiz və toksik olmayan", "Yağlı və gec quruyan", "Suda həll olunmayan", "Kəskin qoxulu"], answer: 0 },
            { q: "28. Ştamplama texnikasında hansı materiallardan faydalanmaq olar?", options: ["Kartof, yarpaq, süngər möhürlər", "Dəmir hissələr", "Şüşə qırıqları", "Bitişik daşlar"], answer: 0 },
            { q: "29. Lepka işində istifadə olunan plastilinin yumşaldılması necə həyata keçirilir?", options: ["Əl içi istiliyi və ovuşdurma ilə", "Suya atıb qaynatmaqla", "Bıçaqla doğramaqla", "Dondurucuya qoymaqla"], answer: 0 },

const optionPrefixes = ["A", "B", "C", "D"];
let currentTopicIndex = 0;
let currentQuestions = [];
let activeQuestionsList = [];
let currentQuestionIndex = 0;
let userAnswers = [];
let isReviewMode = false;

function initTopic(topicIdx) {
    currentTopicIndex = topicIdx;
    isReviewMode = false;
    let topicData = quizTopics[currentTopicIndex];
    
    document.getElementById("topic-title").innerText = topicData.title;

    currentQuestions = topicData.questions.map(qObj => ({
        q: qObj.q,
        options: [...qObj.options],
        answer: qObj.answer
    }));

    activeQuestionsList = currentQuestions.map((q, idx) => ({ question: q, originalIndex: idx }));
    currentQuestionIndex = 0;
    userAnswers = new Array(currentQuestions.length).fill(null);
    
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    
    showQuestion();
}

function showQuestion() {
    let item = activeQuestionsList[currentQuestionIndex];
    let q = item.question;
    let originalIdx = item.originalIndex;
    let total = activeQuestionsList.length;

    document.getElementById("prev-btn").disabled = (currentQuestionIndex === 0);
    
    if (isReviewMode) {
        document.getElementById("next-btn").innerText = (currentQuestionIndex === total - 1) ? "NƏTİCƏLƏR" : "NÖVBƏTİ";
    } else {
        document.getElementById("next-btn").innerText = (currentQuestionIndex === total - 1) ? "TAMAMLA" : "NÖVBƏTİ";
    }

    document.getElementById("question-number").innerText = `${currentQuestionIndex + 1} / ${total}`;
    document.getElementById("progress-bar").style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;

    document.getElementById("question-text").innerText = q.q;

    let optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    let selectedIdx = userAnswers[originalIdx];
    let correctIdx = q.answer;

    q.options.forEach((optText, idx) => {
        let btn = document.createElement("button");
        btn.className = "option-btn";
        let prefix = optionPrefixes[idx] || "";
        
        if (isReviewMode) {
            btn.disabled = true;
            if (idx === correctIdx) {
                btn.classList.add("correct");
                btn.innerHTML = `<div><span class="option-prefix">${prefix}</span><span>${optText}</span></div> <span>✓</span>`;
            } else if (idx === selectedIdx) {
                btn.classList.add("wrong");
                btn.innerHTML = `<div><span class="option-prefix">${prefix}</span><span>${optText}</span></div> <span>✗</span>`;
            } else {
                btn.innerHTML = `<div><span class="option-prefix">${prefix}</span><span>${optText}</span></div>`;
            }
        } 
        else {
            if (selectedIdx === idx) {
                btn.classList.add("selected");
            }

            if (selectedIdx !== null) {
                if (idx === correctIdx) {
                    btn.classList.add("correct");
                    btn.innerHTML = `<div><span class="option-prefix">${prefix}</span><span>${optText}</span></div> <span>✓</span>`;
                } else if (idx === selectedIdx) {
                    btn.classList.add("wrong");
                    btn.innerHTML = `<div><span class="option-prefix">${prefix}</span><span>${optText}</span></div> <span>✗</span>`;
                } else {
                    btn.innerHTML = `<div><span class="option-prefix">${prefix}</span><span>${optText}</span></div>`;
                }
            } else {
                btn.innerHTML = `<div><span class="option-prefix">${prefix}</span><span>${optText}</span></div>`;
            }
            btn.onclick = () => selectOption(idx);
        }

        optionsContainer.appendChild(btn);
    });
}

function selectOption(selectedIndex) {
    if (isReviewMode) return;

    let originalIdx = activeQuestionsList[currentQuestionIndex].originalIndex;

    if (userAnswers[originalIdx] === selectedIndex) {
        userAnswers[originalIdx] = null;
    } else {
        userAnswers[originalIdx] = selectedIndex;
    }
    showQuestion();
}

function prevQuestion() {
    if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        showQuestion();
    }
}

function nextQuestion() {
    if (currentQuestionIndex < activeQuestionsList.length - 1) {
        currentQuestionIndex++;
        showQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-screen").style.display = "block";

    let correct = 0, incorrect = 0, unanswered = 0;

    userAnswers.forEach((ans, idx) => {
        if (ans === null) unanswered++;
        else if (ans === currentQuestions[idx].answer) correct++;
        else incorrect++;
    });

    let total = currentQuestions.length;
    let finalScore = Math.max(0, (correct * 1) - (incorrect * 0.25));
    let percentage = (correct / total) * 100;

    document.getElementById("final-score").innerText = `${finalScore.toFixed(2)} / ${total}`;
    document.getElementById("stat-correct").innerText = correct;
    document.getElementById("stat-incorrect").innerText = incorrect;
    document.getElementById("stat-unanswered").innerText = unanswered;
    document.getElementById("stat-percent").innerText = `${percentage.toFixed(1)}%`;

    let nextTopicBtn = document.getElementById("next-topic-btn");
    if (currentTopicIndex + 1 < quizTopics.length) {
        nextTopicBtn.style.display = "inline-flex";
        nextTopicBtn.innerText = `➡️ NÖVBƏTİ MÖVZUYA KEÇ (MÖVZU ${currentTopicIndex + 2})`;
    } else {
        nextTopicBtn.style.display = "none";
    }
}

function reviewAllQuiz() {
    isReviewMode = true;
    activeQuestionsList = currentQuestions.map((q, idx) => ({ question: q, originalIndex: idx }));
    currentQuestionIndex = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    showQuestion();
}

function reviewWrongQuiz() {
    let wrongList = [];

    currentQuestions.forEach((q, idx) => {
        let ans = userAnswers[idx];
        if (ans !== null && ans !== q.answer) {
            wrongList.push({ question: q, originalIndex: idx });
        }
    });

    if (wrongList.length === 0) {
        alert("Təbrik edirik! Sizin heç bir səhv cavabınız yoxdur. 🎉");
        return;
    }

    isReviewMode = true;
    activeQuestionsList = wrongList;
    currentQuestionIndex = 0;
    document.getElementById("result-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    showQuestion();
}

function startNextTopic() {
    if (currentTopicIndex + 1 < quizTopics.length) {
        initTopic(currentTopicIndex + 1);
    }
}

function restartCurrentTopic() {
    initTopic(currentTopicIndex);
}

window.onload = function() {
    initTopic(0);
};
</script>
